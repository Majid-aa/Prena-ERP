version: '3.8'

services:
  prena-api:
    build:
      context: .
      dockerfile: Dockerfile.Api
    container_name: prena-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=prena-db;Database=PrenaDB;User=sa;Password=Prena@2026!;TrustServerCertificate=True
      - Jwt__Key=Prena-Production-Key-At-Least-256-Bits-Long-For-HS256-2026!@#$
      - Jwt__Issuer=Prena.Identity
      - Jwt__Audience=Prena.All
    depends_on:
      prena-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - prena-network

  prena-web:
    build:
      context: .
      dockerfile: Dockerfile.Web
    container_name: prena-web
    ports:
      - "80:80"
    depends_on:
      - prena-api
    restart: unless-stopped
    networks:
      - prena-network

  prena-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: prena-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Prena@2026!
    ports:
      - "1433:1433"
    volumes:
      - prena-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Prena@2026!" -Q "SELECT 1" -C
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - prena-network

  prena-redis:
    image: redis:alpine
    container_name: prena-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - prena-network

volumes:
  prena-db-data:

networks:
  prena-network:
    driver: bridge
